[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/atg/*"
  to = "https://www.atg.se/services/racinginfo/v1/api/:splat"
  status = 200
  force = true

# Persistence endpoints live on the FastAPI backend, which a frontend-only deploy
# does not have. Without this rule the SPA catch-all below matches /api/weights and
# serves index.html with a 200 -- the app reads ok:true and reports a successful save
# while nothing was stored. Failing with a 404 is what the code expects. Rules are
# matched in order, so this has to precede the catch-all. vercel.json gets the same
# outcome by excluding `api` from its SPA rewrite.
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

