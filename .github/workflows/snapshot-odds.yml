name: Snapshot odds

# Odds drift can only ever be captured going forward: ATG serves current odds
# with no history and no timestamps, so a capture missed is a capture gone. That
# makes the schedule the experiment. Running here rather than on a laptop means
# it fires whether or not anyone is awake, and the series is committed back so
# it survives a lost disk.
#
# Deliberately NOT on Vercel: that deploy is static (vite -> dist, and /api/atg
# is a rewrite proxy, not a function), so there is no runtime to schedule, and a
# serverless filesystem is ephemeral so nothing there could append to a .jsonl.

# STOPPED 2026-09-12. Scheduled capture is off; this now runs only on demand.
#
# Result of the experiment, so it is not re-run blind: over 6 cards / 40 races,
# drift from 24h out to 2.5h out added nothing to the closing price - coefficient
# -0.004, log-likelihood gain 0.000, 95% CI [-0.50, 0.49]. The same races found
# the market signal at z=4.76, so the test worked; the effect was not there.
#
# What was never tested: the final ~2.5h before the deadline. GitHub delivered a
# scheduled run only every ~3.5h regardless of the cron, so the last reading
# landed 115-224 min out on 5 of 6 cards. That stretch holds ~24% of all price
# movement. To test it, a run would need to sleep until ~10 min before the
# deadline and capture there, rather than relying on cron timing.

on:
  workflow_dispatch:

# Every run appends and pushes; two overlapping runs would race on one file.
concurrency:
  group: snapshot-odds
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capture
        # Belt and braces with the pin inside the script: ATG start times are
        # Swedish local with no zone, and this runner is UTC.
        env:
          TZ: Europe/Stockholm
        run: npx tsx scripts/snapshot-odds.ts --auto

      - name: Commit new rows
        run: |
          if git diff --quiet -- data/odds-snapshots.jsonl; then
            echo "No upcoming card in the window - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds-snapshots.jsonl
          git commit -m "Odds snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A neighbouring run may have landed while this one was fetching.
          git pull --rebase --autostash
          git push
